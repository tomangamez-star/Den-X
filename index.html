<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DenX Animator</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/project-ui.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icons/icon-192.png">
</head>
<body>

<div id="app">

<section id="homeScreen" class="home-card">

<header>

<h1>DENX ANIMATOR</h1>

<p>Create. Animate. Inspire.</p>

</header>

<div class="menu">

<button id="openProject">
Open Project
</button>

<button id="newProject">
New Project
</button>

<button id="settings">
Settings
</button>

</div>

<div class="denx-recent-block">
  <div class="denx-recent-title">Recent Projects</div>
  <div id="recentProjectList" class="denx-recent-list"></div>
</div>

</section>

<footer id="appFooter">

<p>Version 0.3.2 Icon Polish</p>

</footer>

</div>

<dialog id="openProjectsDialog" class="denx-project-dialog">
  <div class="denx-dialog-head"><strong>Open Project</strong><button id="closeOpenProjectsBtn" type="button">×</button></div>
  <div id="openProjectsList" class="denx-project-list"></div>
</dialog>

<dialog id="projectSettingsDialog" class="denx-project-dialog denx-settings-dialog">
  <div class="denx-dialog-head"><strong>Save Settings</strong><button id="closeProjectSettingsBtn" type="button">×</button></div>
  <label class="denx-setting-row"><span>Auto save</span><input id="autoSaveToggle" type="checkbox"></label>
  <label class="denx-setting-row"><span>Save reminder</span><input id="saveReminderToggle" type="checkbox"></label>
  <label class="denx-form-field"><span>Every</span><select id="saveIntervalSelect"><option value="5">5 minutes</option><option value="10">10 minutes</option><option value="15">15 minutes</option><option value="30">30 minutes</option></select></label>
  <small class="denx-setting-note">Auto save and reminders are stored on this device.</small>
</dialog>

<script src="js/project-store.js"></script>
<script src="js/app.js"></script>
<script src="js/home-projects.js"></script>
<script src="js/pwa.js"></script>

</body>
</html>
