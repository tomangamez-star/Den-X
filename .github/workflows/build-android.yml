name: Build DenX Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out DenX
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Prepare and sync Android project
        run: npm run sync:android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DenX-Animator-v0.5.4-alpha-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DenX-Animator-v0.5.4-alpha-APK
          path: DenX-Animator-v0.5.4-alpha-debug.apk
          if-no-files-found: error
          retention-days: 30
