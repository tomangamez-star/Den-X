name: Build DenX Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-release-apk:
    name: Build persistently signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out DenX
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Prepare and sync Android project
        run: npm run sync:android

      - name: Validate persistent signing secrets
        env:
          DENX_KEYSTORE_BASE64: ${{ secrets.DENX_KEYSTORE_BASE64 }}
          DENX_KEYSTORE_PASSWORD: ${{ secrets.DENX_KEYSTORE_PASSWORD }}
          DENX_KEY_ALIAS: ${{ secrets.DENX_KEY_ALIAS }}
          DENX_KEY_PASSWORD: ${{ secrets.DENX_KEY_PASSWORD }}
        run: |
          test -n "$DENX_KEYSTORE_BASE64" || { echo "Missing DENX_KEYSTORE_BASE64"; exit 1; }
          test -n "$DENX_KEYSTORE_PASSWORD" || { echo "Missing DENX_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$DENX_KEY_ALIAS" || { echo "Missing DENX_KEY_ALIAS"; exit 1; }
          test -n "$DENX_KEY_PASSWORD" || { echo "Missing DENX_KEY_PASSWORD"; exit 1; }
          printf '%s' "$DENX_KEYSTORE_BASE64" | base64 --decode > android/app/denx-release.jks

      - name: Build signed release APK
        working-directory: android
        env:
          DENX_KEYSTORE_FILE: denx-release.jks
          DENX_KEYSTORE_PASSWORD: ${{ secrets.DENX_KEYSTORE_PASSWORD }}
          DENX_KEY_ALIAS: ${{ secrets.DENX_KEY_ALIAS }}
          DENX_KEY_PASSWORD: ${{ secrets.DENX_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name APK
        run: cp android/app/build/outputs/apk/release/app-release.apk DenX-Animator-v0.7.1-alpha-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DenX-Animator-v0.7.1-alpha-SIGNED-APK
          path: DenX-Animator-v0.7.1-alpha-signed.apk
          if-no-files-found: error
          retention-days: 30
