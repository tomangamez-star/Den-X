<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings · DenX</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/project-ui.css">
<link rel="stylesheet" href="css/v0.3.4-stability.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111111">
<link rel="stylesheet" href="css/tool-identity.css">
<style>
.denx-diagnostic-card{margin-top:12px;padding:12px;border:1px solid #283037;border-radius:12px;background:#101417}
.denx-diagnostic-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.denx-diagnostic-row+ .denx-diagnostic-row{border-top:1px solid #20272c}
.denx-diagnostic-row span strong,.denx-diagnostic-row span small{display:block}
.denx-diagnostic-row span strong{font-size:11px;color:#f0f3f5}
.denx-diagnostic-row span small{margin-top:3px;font-size:8px;color:#7f8a90}
.denx-renderer-pill{white-space:nowrap;padding:5px 8px;border:1px solid rgba(0,200,255,.28);border-radius:999px;background:rgba(0,200,255,.08);color:#00c8ff;font-size:9px;font-weight:900}
.denx-renderer-pill.fallback{border-color:rgba(240,173,78,.32);background:rgba(240,173,78,.08);color:#f0ad4e}
</style>
</head>
<body>
<div id="app">
  <section class="home-card denx-native-page denx-settings-page">
    <button id="settingsBackBtn" class="denx-back-link" type="button">← Back</button>

    <div class="denx-native-copy">
      <h2>DenX<br>Settings</h2>
      <p>Animation preferences that stay with this device.</p>
    </div>

    <section class="denx-native-panel denx-settings-panel">
      <div class="denx-native-panel-head">
        <div>
          <span class="denx-native-kicker">WORKFLOW</span>
          <strong>Project Saving</strong>
        </div>
      </div>

      <label class="denx-native-setting-row">
        <span>
          <strong>Auto save</strong>
          <small>Periodically save the active project.</small>
        </span>
        <input id="nativeAutoSaveToggle" type="checkbox">
      </label>

      <label class="denx-native-setting-row">
        <span>
          <strong>Save reminder</strong>
          <small>Remind me when auto save is disabled.</small>
        </span>
        <input id="nativeSaveReminderToggle" type="checkbox">
      </label>

      <label class="denx-native-setting-select">
        <span>
          <strong>Save interval</strong>
          <small>How often DenX checks your project.</small>
        </span>
        <select id="nativeSaveIntervalSelect">
          <option value="5">5 minutes</option>
          <option value="10">10 minutes</option>
          <option value="15">15 minutes</option>
          <option value="30">30 minutes</option>
        </select>
      </label>

      <div class="denx-diagnostic-card">
        <div class="denx-native-panel-head">
          <div>
            <span class="denx-native-kicker">SYSTEM</span>
            <strong>Graphics Diagnostics</strong>
          </div>
        </div>

        <div class="denx-diagnostic-row">
          <span>
            <strong>Renderer</strong>
            <small>Last renderer used by the workspace.</small>
          </span>
          <b id="denxSettingsRenderer" class="denx-renderer-pill">Not checked</b>
        </div>

        <div class="denx-diagnostic-row">
          <span>
            <strong>Acceleration</strong>
            <small>GPU artwork path when WebGL2 is active.</small>
          </span>
          <b id="denxSettingsAcceleration" class="denx-renderer-pill">Unknown</b>
        </div>
      </div>

      <div class="denx-settings-foot">DENX · Version 0.5.4</div>
    </section>
  </section>
</div>
<script src="js/project-store.js"></script>
<script src="js/settings.js"></script>
<script src="js/settings-diagnostics-v054.js"></script>
<script src="js/tool-identity.js"></script>
</body>
</html>
