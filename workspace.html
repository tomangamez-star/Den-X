<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workspace</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/workspace-ui.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icons/icon-192.png">
</head>
<body>
<section id="workspace">
  <header class="topbar">
    <div class="topbar-actions topbar-actions--left">
      <button id="workspaceBack" class="topbar-btn" title="Back" aria-label="Back">←</button>
      <button id="undoBtn" class="topbar-btn" title="Undo" aria-label="Undo">↶</button>
      <button id="redoBtn" class="topbar-btn" title="Redo" aria-label="Redo">↷</button>
    </div>

    <div class="top-timeline" aria-label="Animation frames">
      <button id="addFrame" class="timeline-add" title="Add frame" aria-label="Add frame">＋</button>
      <div id="frameContainer">
        <button class="frame active" data-frame="1">1</button>
      </div>
    </div>

    <div class="topbar-brand" aria-label="DenX Animator">DenX</div>

    <div class="topbar-actions topbar-actions--right">
      <button id="zoomOut" class="topbar-btn" title="Zoom out" aria-label="Zoom out">−</button>
      <button id="zoomIn" class="topbar-btn" title="Zoom in" aria-label="Zoom in">＋</button>
      <button class="topbar-btn" title="Save" aria-label="Save">💾</button>
      <button class="topbar-btn topbar-btn--play" title="Play" aria-label="Play">▶</button>
      <button class="topbar-btn" title="Settings" aria-label="Settings">⚙</button>
    </div>
  </header>

  <div class="editor">
    <aside class="toolbar" aria-label="Tools">
      <button id="selectTool" title="Select" aria-label="Select">
        <span class="tool-icon">↖</span><span class="tool-label">Select</span>
      </button>
      <button id="boneTool" title="Bone" aria-label="Bone">
        <span class="tool-icon">🦴</span><span class="tool-label">Bone</span>
      </button>
      <button id="pencilTool" title="Pencil" aria-label="Pencil">
        <span class="tool-icon">✎</span><span class="tool-label">Pencil</span>
      </button>
      <button id="eraserTool" title="Eraser" aria-label="Eraser">
        <span class="tool-icon">◇</span><span class="tool-label">Eraser</span>
      </button>
      <button id="cameraTool" title="Camera" aria-label="Camera">
        <span class="tool-icon">📷</span><span class="tool-label">Camera</span>
      </button>
    </aside>

    <aside id="cameraProperties" class="camera-properties hidden" aria-hidden="true">
      <div class="camera-properties__title">Camera</div>

      <label><span>X</span><input type="number" id="cameraPropX" step="1"></label>
      <label><span>Y</span><input type="number" id="cameraPropY" step="1"></label>
      <label><span>Width</span><input type="number" id="cameraPropWidth" step="1" min="40"></label>
      <label><span>Height</span><input type="number" id="cameraPropHeight" step="1" min="40"></label>
      <label><span>Rotation</span><input type="number" id="cameraPropRotation" step="1"></label>

      <label class="camera-toggle">
        <input type="checkbox" id="cameraPropGuide">
        <span>Stage guide</span>
      </label>

      <label class="camera-toggle">
        <input type="checkbox" id="cameraPropQuickMove">
        <span>Quick move handle</span>
      </label>
    </aside>

    <div id="viewport">
      <div id="camera">
        <div id="stageGuide" aria-hidden="true"></div>
        <div id="stage">
          <canvas id="drawingCanvas"></canvas>
        </div>
        <div id="cameraFrame" aria-hidden="true">
          <div class="camera-handle camera-handle-rotate" data-handle="rotate" aria-hidden="true"></div>
          <div class="camera-handle camera-handle-resize" data-handle="resize" aria-hidden="true"></div>
          <div class="camera-handle camera-handle-move" data-handle="move" aria-hidden="true"></div>
        </div>
      </div>
    </div>
  </div>
</section>

<script src="js/app.js"></script>
<script src="js/history.js"></script>
<script src="js/tools.js"></script>
<script src="js/drawing.js"></script>
<script src="js/camera.js"></script>
<script src="js/timeline.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
