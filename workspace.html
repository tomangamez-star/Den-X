<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DenX Workspace</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/workspace-ui.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icons/icon-192.png">
</head>
<body>
<section id="workspace">
  <header class="topbar">
    <div class="topbar-left">
      <button id="undoBtn" class="topbar-btn" title="Undo" aria-label="Undo">↶</button>
      <button id="redoBtn" class="topbar-btn" title="Redo" aria-label="Redo">↷</button>
    </div>

    <div class="top-timeline" aria-label="Animation frames">
      <div id="frameContainer">
        <button class="frame active" data-frame="1">1</button>
      </div>
    </div>

    <div class="topbar-cluster" aria-label="Frame and app controls">
      <button id="copyFrameBtn" class="cluster-btn" title="Copy current frame" aria-label="Copy current frame">⧉</button>
      <button id="addFrame" class="cluster-btn" title="Add frame" aria-label="Add frame">＋</button>
      <button id="removeFrameBtn" class="cluster-btn" title="Remove current frame" aria-label="Remove current frame">−</button>

      <button id="pasteFrameBtn" class="cluster-btn" title="Paste copied frame" aria-label="Paste copied frame">📋</button>
      <button id="playBtn" class="cluster-btn" title="Play" aria-label="Play">▶</button>
      <button id="workspaceSettingsBtn" class="cluster-btn" title="Settings" aria-label="Settings">⚙</button>
    </div>
  </header>

  <div class="editor">
    <aside id="toolbox" class="toolbar expanded-toolbar" aria-label="DenX toolbox">

      <section class="tool-section" id="tool-general" data-tool-section="general">
        <div class="tool-section-title">General</div>

        <button id="panTool" class="tool-row active" title="Pan" aria-label="Pan">
          <span class="tool-icon">✥</span><span class="tool-label">Pan</span>
        </button>

        <button id="selectTool" class="tool-row" title="Select" aria-label="Select">
          <span class="tool-icon">↖</span><span class="tool-label">Select</span>
        </button>

        <label class="tool-control" title="Workspace background">
          <span class="tool-control-icon">▣</span>
          <span class="tool-control-name">Background</span>
          <input id="backgroundColorControl" type="color" value="#ffffff" aria-label="Workspace background color">
        </label>
      </section>

      <section class="tool-section" id="tool-draw" data-tool-section="draw">
        <div class="tool-section-title">Draw</div>

        <button id="pencilTool" class="tool-row" title="Pencil" aria-label="Pencil">
          <span class="tool-icon">✎</span><span class="tool-label">Pencil</span>
        </button>

        <label class="tool-control" title="Drawing color">
          <span class="tool-control-icon">●</span>
          <span class="tool-control-name">Color</span>
          <input id="drawColorControl" type="color" value="#000000" aria-label="Drawing color">
        </label>

        <button id="eraserTool" class="tool-row" title="Eraser" aria-label="Eraser">
          <span class="tool-icon">◇</span><span class="tool-label">Eraser</span>
        </button>
      </section>

      <section class="tool-section" id="tool-animation" data-tool-section="animation">
        <div class="tool-section-title">Animate</div>

        <button id="onionSkinBtn" class="tool-row tool-action" title="Toggle onion skin" aria-label="Toggle onion skin" aria-pressed="false">
          <span class="tool-icon">◉</span><span class="tool-label">Onion</span>
        </button>

        <label class="animation-number-control">
          <span>FPS</span>
          <input id="animationFpsInput" type="number" min="1" max="60" step="1" value="12" inputmode="numeric">
        </label>

        <label class="animation-toggle-control">
          <span>Previous</span>
          <input id="onionPrevToggle" type="checkbox" checked>
        </label>

        <label class="animation-toggle-control">
          <span>Next</span>
          <input id="onionNextToggle" type="checkbox" checked>
        </label>

        <label class="animation-range-control">
          <span>Ghost</span>
          <input id="onionOpacityInput" type="range" min="0.08" max="0.65" step="0.01" value="0.28">
        </label>

        <label class="animation-toggle-control">
          <span>Loop</span>
          <input id="animationLoopToggle" type="checkbox" checked>
        </label>
      </section>

      <section class="tool-section" id="tool-figure" data-tool-section="figure">
        <div class="tool-section-title">Figure</div>

        <button id="createFigureBtn" class="tool-row tool-action" title="Open Figure Creator" aria-label="Create figure">
          <span class="tool-icon">＋</span><span class="tool-label">Create</span>
        </button>

        <button id="importFigureBtn" class="tool-row tool-action" title="Import a saved figure into this project" aria-label="Import figure">
          <span class="tool-icon">⇩</span><span class="tool-label">Import</span>
        </button>

        <label class="project-figure-picker">
          <span>In Project</span>
          <select id="workspaceFigureSelect" aria-label="Figures imported into this project">
            <option value="">No figures</option>
          </select>
        </label>

        <button id="addFigureBtn" class="tool-row tool-action" title="Add selected project figure to the canvas" aria-label="Add figure" disabled>
          <span class="tool-icon">⊕</span><span class="tool-label">Add</span>
        </button>
      </section>

      <section class="tool-section" id="tool-camera" data-tool-section="camera">
        <div class="tool-section-title">Camera</div>

        <button id="cameraTool" class="tool-row" title="Camera" aria-label="Camera">
          <span class="tool-icon">▣</span><span class="tool-label">Camera</span>
        </button>
      </section>
    </aside>

    <nav class="tool-quickfind" aria-label="Toolbox quick find">
      <button class="quickfind-link active" data-tool-target="general">General</button>
      <button class="quickfind-link" data-tool-target="draw">Draw</button>
      <button class="quickfind-link" data-tool-target="animation">Animate</button>
      <button class="quickfind-link" data-tool-target="figure">Figure</button>
      <button class="quickfind-link" data-tool-target="camera">Camera</button>
    </nav>

    <aside id="cameraProperties" class="camera-properties hidden" aria-hidden="true">
      <div class="camera-properties__title">Camera</div>

      <label><span>X</span><input type="number" id="cameraPropX" step="1"></label>
      <label><span>Y</span><input type="number" id="cameraPropY" step="1"></label>
      <label><span>Width</span><input type="number" id="cameraPropWidth" step="1" min="40"></label>
      <label><span>Height</span><input type="number" id="cameraPropHeight" step="1" min="40"></label>
      <label><span>Rotation</span><input type="number" id="cameraPropRotation" step="1"></label>

      <label class="camera-toggle">
        <input type="checkbox" id="cameraPropGuide">
        <span>Stage guide</span>
      </label>

      <label class="camera-toggle">
        <input type="checkbox" id="cameraPropQuickMove">
        <span>Quick move handle</span>
      </label>
    </aside>

    <div id="viewport">
      <div id="camera">
        <div id="stageGuide" aria-hidden="true"></div>
        <div id="stage">
          <canvas id="onionCanvas" aria-hidden="true"></canvas>
          <canvas id="drawingCanvas"></canvas>

          <svg
            id="onionFigureLayer"
            viewBox="0 0 2048 1152"
            preserveAspectRatio="none"
            aria-hidden="true"
          ></svg>

          <svg
            id="figureLayer"
            viewBox="0 0 2048 1152"
            preserveAspectRatio="none"
            aria-label="DenX figure layer"
          ></svg>
        </div>

        <div id="cameraFrame" aria-hidden="true">
          <div class="camera-handle camera-handle-rotate" data-handle="rotate" aria-hidden="true"></div>
          <div class="camera-handle camera-handle-resize" data-handle="resize" aria-hidden="true"></div>
          <div class="camera-handle camera-handle-move" data-handle="move" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <div class="zoom-controls" aria-label="Zoom controls">
      <button id="zoomIn" class="zoom-btn" title="Zoom in" aria-label="Zoom in">＋</button>
      <button id="zoomOut" class="zoom-btn" title="Zoom out" aria-label="Zoom out">−</button>
    </div>
  </div>
</section>

<div id="figureImportModal" class="figure-modal hidden" aria-hidden="true">
  <div class="figure-modal-card figure-browser-card" role="dialog" aria-modal="true" aria-labelledby="figureImportTitle">
    <div class="figure-modal-head">
      <div>
        <strong id="figureImportTitle">Figure Browser</strong>
        <small>Import makes a figure available to this project. It will not appear on the canvas until you press Add.</small>
      </div>
      <button id="closeFigureImportBtn" class="modal-close" aria-label="Close">×</button>
    </div>

    <div class="figure-browser-section">
      <div class="figure-modal-section-title">Built-in Figures</div>
      <div id="builtinFigureList" class="saved-figure-list"></div>
    </div>

    <div class="figure-browser-section">
      <div class="figure-modal-section-title">
        <span>My Figures</span>
        <span id="myFiguresCount" class="figure-count-badge">0</span>
      </div>
      <div id="savedFigureList" class="saved-figure-list"></div>
    </div>

    <button id="importFromPhoneBtn" class="phone-import-btn" type="button">
      <span class="phone-import-icon">⇩</span>
      <span>
        <strong>Import from Phone</strong>
        <small>.dxf or DenX JSON figure</small>
      </span>
    </button>

    <input id="figureFileInput" class="hidden-file-input" type="file" accept=".dxf,.json,application/json">
  </div>
</div>

<div id="denxToast" class="denx-toast" aria-live="polite"></div>

<script src="js/app.js"></script>
<script src="js/history.js"></script>
<script src="js/figure-library.js"></script>
<script src="js/tools.js"></script>
<script src="js/workspace-ui.js"></script>
<script src="js/figure-import.js"></script>
<script src="js/drawing.js"></script>
<script src="js/camera.js"></script>
<script src="js/bones.js"></script>
<script src="js/timeline.js"></script>
<script src="js/workspace-persistence.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
